<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cihuy! Halaman kecil untuk semangat yang besar.">
  <title>Cihuy!</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 24px; background: #fff8e7; color: #28251f; font-family: Arial, Helvetica, sans-serif; }
    main { width: min(100%, 620px); padding: clamp(28px, 7vw, 64px); border: 2px solid #28251f; border-radius: 24px; background: #fffdf7; box-shadow: 8px 8px 0 #28251f; text-align: center; }
    .badge { display: inline-block; padding: 8px 14px; border-radius: 999px; background: #ffe29a; font-size: 12px; font-weight: 700; letter-spacing: 2px; }
    h1 { margin: 24px 0 16px; font-size: clamp(56px, 13vw, 100px); line-height: 1; letter-spacing: -4px; }
    p { margin: 0 auto; max-width: 370px; color: #645e51; font-size: 18px; line-height: 1.7; }
    a { display: inline-block; margin-top: 32px; padding: 14px 24px; border: 2px solid #28251f; border-radius: 10px; background: #ffce55; color: #28251f; text-decoration: none; font-weight: 700; }
    a:hover { background: #ffdf8d; }
    a:focus-visible { outline: 3px solid #305bba; outline-offset: 5px; }
    footer { margin-top: 30px; color: #645e51; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <span class="badge">SELAMAT DATANG</span>
    <h1>Cihuy!</h1>
    <p>Halaman kecil, semangat besar. Yuk, bikin hari ini lebih seru dengan satu ide baru.</p>
    <a href="index.html">Kembali ke beranda <span aria-hidden="true">↗</span></a>
    <footer>Dibuat untuk merayakan hal-hal sederhana.</footer>
  </main>
</body>
</html>
